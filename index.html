<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wine Cellar Registry</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0a08;
  --surface: #141009;
  --card: #1a1410;
  --border: #2a2018;
  --border-light: #3a3025;
  --gold: #c9a84c;
  --gold-dim: #8a6e30;
  --gold-subtle: #3d2e12;
  --text: #e8dcc8;
  --text-dim: #9a8a72;
  --text-muted: #5a4e3e;
  --red-wine: #7a1e2e;
  --red-dim: #5a2020;
  --red-subtle: #2a1010;
  --row-a: #c9a84c; --row-b: #6db87a; --row-c: #5ba8d4; --row-d: #e07856;
  --row-e: #c46bb8; --row-f: #d4b84a; --row-g: #78c4b2; --row-h: #e8845c;
  --row-i: #c9a84c; --row-j: #6db87a; --row-k: #5ba8d4; --row-l: #e07856;
  --row-m: #c46bb8; --row-n: #d4b84a; --row-o: #78c4b2; --row-p: #e8845c;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Mono', monospace;
  font-size: 13px;
  min-height: 100vh;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 1000;
  opacity: 0.4;
}

/* ── PIN LOCK SCREEN ─────────────────────────────────────────────────────── */
#pin-screen {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 900;
}
.pin-box {
  width: 320px;
  text-align: center;
}
.pin-logo {
  font-family: 'Cormorant Garamond', serif;
  font-size: 48px;
  font-weight: 300;
  color: var(--gold);
  letter-spacing: 0.04em;
  margin-bottom: 6px;
}
.pin-sub {
  color: var(--text-muted);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  margin-bottom: 40px;
}
.pin-label {
  color: var(--text-dim);
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  margin-bottom: 12px;
}
.pin-dots {
  display: flex;
  justify-content: center;
  gap: 14px;
  margin-bottom: 28px;
}
.pin-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  border: 1px solid var(--gold-dim);
  background: transparent;
  transition: background 0.15s, border-color 0.15s;
}
.pin-dot.filled {
  background: var(--gold);
  border-color: var(--gold);
}
.pin-dot.error {
  background: #c46b6b;
  border-color: #c46b6b;
}
.pin-keypad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 14px;
}
.pin-key {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px;
  font-weight: 300;
  padding: 16px;
  cursor: pointer;
  transition: all 0.12s;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.pin-key:hover, .pin-key:active {
  background: var(--gold-subtle);
  border-color: var(--gold-dim);
  color: var(--gold);
}
.pin-key.wide {
  grid-column: span 2;
}
.pin-error {
  color: #c46b6b;
  font-size: 11px;
  letter-spacing: 0.1em;
  min-height: 18px;
  margin-top: 4px;
}
.pin-hint {
  color: var(--text-muted);
  font-size: 10px;
  margin-top: 24px;
  letter-spacing: 0.08em;
}

/* ── APP (hidden until unlocked) ──────────────────────────────────────────── */
#app { display: none; }

.header {
  border-bottom: 1px solid var(--border);
  padding: 32px 40px 24px;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  flex-wrap: wrap;
}
.header-left h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 42px;
  font-weight: 300;
  color: var(--gold);
  letter-spacing: 0.04em;
  line-height: 1;
}
.header-left p {
  color: var(--text-dim);
  margin-top: 6px;
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.stats { display: flex; gap: 32px; flex-wrap: wrap; }
.stat { text-align: right; }
.stat-val {
  font-family: 'Cormorant Garamond', serif;
  font-size: 28px;
  font-weight: 300;
  color: var(--gold);
  line-height: 1;
}
.stat-label {
  color: var(--text-muted);
  font-size: 10px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin-top: 3px;
}

.toolbar {
  padding: 16px 40px;
  display: flex;
  gap: 12px;
  align-items: center;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.search-wrap {
  position: relative;
  flex: 1;
  min-width: 200px;
  max-width: 340px;
}
.search-wrap input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  padding: 8px 12px 8px 32px;
  outline: none;
  transition: border-color 0.2s;
}
.search-wrap input:focus { border-color: var(--gold-dim); }
.search-wrap input::placeholder { color: var(--text-muted); }
.search-icon {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  font-size: 12px;
  pointer-events: none;
}
.filter-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-dim);
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  padding: 8px 14px;
  cursor: pointer;
  letter-spacing: 0.06em;
  transition: all 0.15s;
  text-transform: uppercase;
}
.filter-btn:hover, .filter-btn.active {
  background: var(--gold-subtle);
  border-color: var(--gold-dim);
  color: var(--gold);
}
.view-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-muted);
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  padding: 8px 12px;
  cursor: pointer;
  transition: all 0.15s;
}
.view-btn.active, .view-btn:hover {
  background: var(--gold-subtle);
  border-color: var(--gold-dim);
  color: var(--gold);
}
.toolbar-actions {
  display: flex;
  gap: 8px;
  margin-left: auto;
  align-items: center;
}
.add-btn {
  background: var(--gold-subtle);
  border: 1px solid var(--gold-dim);
  color: var(--gold);
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  padding: 8px 16px;
  cursor: pointer;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  transition: all 0.15s;
}
.add-btn:hover { background: var(--gold); color: var(--bg); }
.remove-btn {
  background: var(--red-subtle);
  border: 1px solid var(--red-dim);
  color: #9a5050;
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  padding: 8px 16px;
  cursor: pointer;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  transition: all 0.15s;
}
.remove-btn:hover { background: #c46b6b; border-color: #c46b6b; color: var(--bg); }
.export-btn {
  background: #0e1a14;
  border: 1px solid #2a5a3a;
  color: #6ab87a;
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  padding: 8px 16px;
  cursor: pointer;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  transition: all 0.15s;
}
.export-btn:hover { background: #6ab87a; border-color: #6ab87a; color: var(--bg); }

.lock-btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-muted);
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  padding: 8px 12px;
  cursor: pointer;
  transition: all 0.15s;
  letter-spacing: 0.06em;
}
.lock-btn:hover { border-color: var(--gold-dim); color: var(--gold); }

.main { padding: 24px 40px 60px; }
.table-view { display: block; }
.grid-view { display: none; }

.section-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 28px 0 10px;
}
.section-label {
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px;
  font-weight: 300;
  letter-spacing: 0.06em;
}
.section-line { flex: 1; height: 1px; background: var(--border); }
.section-meta {
  color: var(--text-muted);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.table-wrap { width: 100%; }
table { width: 100%; border-collapse: collapse; }
.table-wrap table { table-layout: fixed; width: 100%; }
.table-wrap table th:nth-child(1), .table-wrap table td:nth-child(1) { width: 90px; }
.table-wrap table th:nth-child(2), .table-wrap table td:nth-child(2) { width: 52px; }
.table-wrap table th:nth-child(3), .table-wrap table td:nth-child(3) { width: 180px; }
.table-wrap table th:nth-child(4), .table-wrap table td:nth-child(4) { width: auto; }
.table-wrap table th:nth-child(5), .table-wrap table td:nth-child(5) { width: 80px; }
.table-wrap table th:nth-child(6), .table-wrap table td:nth-child(6) { width: 130px; }
.table-wrap table th:nth-child(7), .table-wrap table td:nth-child(7) { width: 75px; text-align: right; }
.table-wrap table th:nth-child(8), .table-wrap table td:nth-child(8) { width: 105px; }
.table-wrap table td { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

@media (max-width: 768px) {
  .col-label, .col-vintage, .col-region { display: none; }
  .main { padding: 16px 12px 40px; }
}

th {
  text-align: left;
  font-size: 10px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--text-muted);
  padding: 6px 10px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  white-space: nowrap;
  user-select: none;
}
th:hover { color: var(--gold); }
td {
  padding: 9px 10px;
  border-bottom: 1px solid var(--border);
  color: var(--text);
  vertical-align: middle;
}
tr:hover td { background: rgba(201,168,76,0.04); }
.slot-badge {
  display: inline-block;
  font-size: 10px;
  letter-spacing: 0.08em;
  padding: 2px 7px;
  font-weight: 400;
  border: 1px solid;
  white-space: nowrap;
}
.producer { color: var(--text); font-weight: 400; }
.label { color: var(--text-dim); font-size: 12px; }
.vintage { color: var(--gold-dim); font-family: 'Cormorant Garamond', serif; font-size: 15px; }
.region { color: var(--text-muted); font-size: 11px; }
.value {
  font-family: 'Cormorant Garamond', serif;
  font-size: 16px;
  font-weight: 300;
  color: var(--gold);
  text-align: right;
  white-space: nowrap;
}
.qty-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  background: var(--gold-subtle);
  border: 1px solid var(--gold-dim);
  color: var(--gold);
  font-size: 10px;
  font-weight: 400;
}
.actions { display: flex; gap: 6px; justify-content: flex-end; }
.btn-sm {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-muted);
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  padding: 3px 8px;
  cursor: pointer;
  transition: all 0.15s;
  letter-spacing: 0.06em;
}
.btn-sm:hover { border-color: var(--gold-dim); color: var(--gold); }
.btn-sm.consume:hover { border-color: #c46b6b; color: #c46b6b; }

/* GRID VIEW */
.grid-container {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 10px;
}
.wine-card {
  background: var(--card);
  border: 1px solid var(--border);
  padding: 14px;
  transition: border-color 0.2s, transform 0.15s;
  cursor: pointer;
  position: relative;
  overflow: hidden;
}
.wine-card:hover { border-color: var(--gold-dim); transform: translateY(-1px); }
.card-slot {
  font-size: 9px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.card-producer {
  font-family: 'Cormorant Garamond', serif;
  font-size: 16px;
  font-weight: 400;
  color: var(--text);
  line-height: 1.2;
  margin-bottom: 3px;
}
.card-label { font-size: 10px; color: var(--text-dim); margin-bottom: 10px; line-height: 1.3; }
.card-footer { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 8px; }
.card-vintage { font-family: 'Cormorant Garamond', serif; font-size: 18px; color: var(--gold-dim); font-weight: 300; }
.card-value { font-family: 'Cormorant Garamond', serif; font-size: 16px; color: var(--gold); font-weight: 300; }

/* MODAL */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  z-index: 500;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--card);
  border: 1px solid var(--border-light);
  width: 100%;
  max-width: 520px;
  padding: 32px;
  position: relative;
  max-height: 90vh;
  overflow-y: auto;
}
.modal h2 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 26px;
  font-weight: 300;
  letter-spacing: 0.04em;
  margin-bottom: 24px;
}
.modal h2.add-title { color: var(--gold); }
.modal h2.remove-title { color: #c46b6b; }
.modal-close {
  position: absolute;
  top: 16px; right: 16px;
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 18px;
  cursor: pointer;
  padding: 4px 8px;
}
.modal-close:hover { color: var(--text); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
.form-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
.form-group label {
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-muted);
}
.form-group input, .form-group select {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  padding: 9px 12px;
  outline: none;
  transition: border-color 0.2s;
  width: 100%;
}
.form-group input:focus, .form-group select:focus { border-color: var(--gold-dim); }
.form-group select option { background: var(--card); }
.modal-footer {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
}
.btn-cancel {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-dim);
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  padding: 9px 20px;
  cursor: pointer;
  letter-spacing: 0.08em;
  transition: all 0.15s;
}
.btn-cancel:hover { border-color: var(--border-light); color: var(--text); }
.btn-save {
  background: var(--gold-subtle);
  border: 1px solid var(--gold-dim);
  color: var(--gold);
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  padding: 9px 24px;
  cursor: pointer;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  transition: all 0.15s;
}
.btn-save:hover { background: var(--gold); color: var(--bg); }
.btn-remove-confirm {
  background: var(--red-subtle);
  border: 1px solid var(--red-dim);
  color: #c46b6b;
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  padding: 9px 24px;
  cursor: pointer;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  transition: all 0.15s;
}
.btn-remove-confirm:hover { background: #c46b6b; color: var(--bg); border-color: #c46b6b; }
.btn-delete {
  background: none;
  border: 1px solid #5a2020;
  color: #9a4040;
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  padding: 9px 16px;
  cursor: pointer;
  letter-spacing: 0.08em;
  transition: all 0.15s;
  margin-right: auto;
}
.btn-delete:hover { background: #3a1010; border-color: #9a4040; color: #c46b6b; }

/* Remove modal search results */
.remove-search-wrap { position: relative; margin-bottom: 14px; }
.remove-search-wrap input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  padding: 9px 12px 9px 32px;
  outline: none;
  transition: border-color 0.2s;
}
.remove-search-wrap input:focus { border-color: #c46b6b; }
.remove-search-wrap .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 12px; pointer-events: none; }
.remove-results {
  max-height: 220px;
  overflow-y: auto;
  border: 1px solid var(--border);
  background: var(--surface);
  margin-bottom: 14px;
}
.remove-result-item {
  padding: 10px 14px;
  cursor: pointer;
  border-bottom: 1px solid var(--border);
  transition: background 0.12s;
  display: flex;
  align-items: center;
  gap: 12px;
}
.remove-result-item:last-child { border-bottom: none; }
.remove-result-item:hover { background: rgba(196,107,107,0.08); }
.remove-result-item.selected { background: rgba(196,107,107,0.15); border-left: 2px solid #c46b6b; }
.rr-slot { font-size: 10px; letter-spacing: 0.08em; padding: 2px 6px; border: 1px solid; white-space: nowrap; flex-shrink: 0; }
.rr-info { flex: 1; min-width: 0; }
.rr-producer { font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rr-label { font-size: 11px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rr-qty { font-size: 11px; color: var(--gold-dim); flex-shrink: 0; }
.remove-empty { padding: 20px; text-align: center; color: var(--text-muted); font-style: italic; }
.remove-selected-summary {
  background: rgba(196,107,107,0.08);
  border: 1px solid var(--red-dim);
  padding: 12px 14px;
  margin-bottom: 14px;
  display: none;
}
.remove-selected-summary.visible { display: block; }
.remove-selected-summary p { font-size: 12px; color: var(--text-dim); margin-bottom: 8px; }
.remove-selected-summary strong { color: var(--text); }
.empty-row td { text-align: center; color: var(--text-muted); padding: 28px; font-style: italic; }
.row-color-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }

/* Toast */
.toast {
  position: fixed;
  bottom: 28px; right: 28px;
  background: var(--card);
  border: 1px solid var(--gold-dim);
  color: var(--gold);
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  padding: 12px 20px;
  letter-spacing: 0.08em;
  z-index: 999;
  opacity: 0;
  transform: translateY(10px);
  transition: all 0.25s;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateY(0); }
.sort-asc::after { content: ' ↑'; color: var(--gold); }
.sort-desc::after { content: ' ↓'; color: var(--gold); }

@media (max-width: 700px) {
  .header, .toolbar, .main { padding-left: 16px; padding-right: 16px; }
  .form-row { grid-template-columns: 1fr; }
  .stats { gap: 18px; }
}
</style>
</head>
<body>

<!-- ── PIN LOCK SCREEN ──────────────────────────────────────────────────── -->
<div id="pin-screen">
  <div class="pin-box">
    <div class="pin-logo">Wine Cellar</div>
    <div class="pin-sub">Personal Registry</div>
    <div class="pin-label">Enter PIN</div>
    <div class="pin-dots" id="pin-dots">
      <div class="pin-dot" id="d0"></div>
      <div class="pin-dot" id="d1"></div>
      <div class="pin-dot" id="d2"></div>
      <div class="pin-dot" id="d3"></div>
    </div>
    <div class="pin-keypad">
      <button class="pin-key" onclick="pinPress('1')">1</button>
      <button class="pin-key" onclick="pinPress('2')">2</button>

function pinPress(digit) {
  if (pinBuffer.length >= 4) return;
  pinBuffer += digit;
  updatePinDots();
  if (pinBuffer.length === 4) {
    setTimeout(checkPin, 120);
  }
}

function pinBackspace() {
  pinBuffer = pinBuffer.slice(0, -1);
  updatePinDots(false);
  document.getElementById('pin-error').textContent = '';
}

function updatePinDots(error = false) {
  for (let i = 0; i < 4; i++) {
    const dot = document.getElementById('d' + i);
    dot.classList.toggle('filled', i < pinBuffer.length);
    dot.classList.toggle('error', error && i < pinBuffer.length);
  }
}

function checkPin() {
  if (pinBuffer === CORRECT_PIN) {
    sessionStorage.setItem(SESSION_KEY, '1');
    unlockApp();
  } else {
    // Flash error
    for (let i = 0; i < 4; i++) {
      const dot = document.getElementById('d' + i);
      dot.classList.remove('filled');
      dot.classList.add('error');
    }
    document.getElementById('pin-error').textContent = 'Incorrect PIN';
    setTimeout(() => {
      pinBuffer = '';
      updatePinDots();
      document.getElementById('pin-error').textContent = '';

  }
}

const DB_URL = 'https://brian-wine-fridge-tracking-app-default-rtdb.firebaseio.com/wine-cellar.json';

// ── NOTE FOR FIREBASE CONSOLE ─────────────────────────────────────────────────
// After deploying this file, go to Firebase Console → Realtime Database → Rules
// and set the rules to:
// {
//   "rules": {
//     ".read": false,
//     ".write": false
//   }
// }
// This locks the database completely. The PIN lives in this file (client-side),
// which is sufficient for personal use — nobody can reach your Firebase URL
// without first passing the PIN screen. For stronger security in the future,
// Firebase Auth can be added.

function saveToStorage() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ inventory, nextId })); } catch(e) {}
  fetch(DB_URL, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ inventory, nextId })
  }).catch(e => console.warn('Firebase sync failed', e));
}

function loadFromStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      if (data.inventory && data.inventory.length > 0) {
        inventory = data.inventory;
        nextId = data.nextId || 50;
      }
    }
  } catch(e) {}
  if (!inventory.length) {
    inventory = JSON.parse(JSON.stringify(SEED_DATA));
    nextId = 50;
  }
  render();
  fetch(DB_URL)
    .then(r => r.json())
    .then(data => {
      if (data && data.inventory && data.inventory.length > 0) {
        inventory = data.inventory;
        nextId = data.nextId || 50;
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ inventory, nextId }));
        render();
        showToast('Synced from cloud ☁️');
      } else {
        saveToStorage();
      }
    })
    .catch(() => {});
}

// ── State ─────────────────────────────────────────────────────────────────────
let inventory = [];
let nextId = 50;
let currentFilter = 'all';
let currentView = 'table';
let searchTerm = '';
let sortKey = 'slot';
let sortDir = 'asc';
let editingId = null;
let removeSelectedId = null;

// ── Helpers ───────────────────────────────────────────────────────────────────
function getRowLetter(slot) { return slot.charAt(0).toUpperCase(); }

function getFilteredData() {
  let data = [...inventory];
  if (currentFilter !== 'all') data = data.filter(e => getRowLetter(e.slot) === currentFilter);
  if (searchTerm) {
    const s = searchTerm.toLowerCase();
    data = data.filter(e =>
      e.producer.toLowerCase().includes(s) ||
      e.label.toLowerCase().includes(s) ||
      e.region.toLowerCase().includes(s) ||
      e.vintage.toString().includes(s) ||
      e.slot.toLowerCase().includes(s)
    );
  }
  data.sort((a, b) => {
    let va = a[sortKey], vb = b[sortKey];
    if (sortKey === 'value') { va = parseFloat(va); vb = parseFloat(vb); }
    if (sortKey === 'slot') {
      const cmp = va.localeCompare(vb, undefined, { numeric: true, sensitivity: 'base' });
      return sortDir === 'asc' ? cmp : -cmp;
    }
    if (va < vb) return sortDir === 'asc' ? -1 : 1;
    if (va > vb) return sortDir === 'asc' ? 1 : -1;
    return 0;
  });
  return data;
}

function totalBottles(data) { return data.reduce((s, e) => s + e.qty, 0); }
function totalValue(data)   { return data.reduce((s, e) => s + e.value * e.qty, 0); }
function uniqueProducers(data) { return new Set(data.map(e => e.producer)).size; }

function groupByRow(data) {
  const groups = {};
  data.forEach(e => {
    const r = getRowLetter(e.slot);
    if (!groups[r]) groups[r] = [];
    groups[r].push(e);
  });
  return groups;
}

// ── Stats ─────────────────────────────────────────────────────────────────────
function updateStats() {
  const data = getFilteredData();
  document.getElementById('stat-bottles').textContent = totalBottles(data);
  document.getElementById('stat-value').textContent = '$' + totalValue(data).toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 0 });
  document.getElementById('stat-producers').textContent = uniqueProducers(data);
}

// ── Render ────────────────────────────────────────────────────────────────────
function renderTable() {
  const data = getFilteredData();
  const groups = groupByRow(data);
  const container = document.getElementById('table-view');
  if (data.length === 0) {
    container.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:60px;font-family:Cormorant Garamond,serif;font-size:20px;font-style:italic">No bottles found</div>';
    return;
  }
  let html = '';
  Object.keys(groups).sort().forEach(row => {
    const entries = groups[row];
    const color = ROW_COLORS[row] || '#888';
    const rowBottles = totalBottles(entries);
    const rowVal = totalValue(entries);
    html += `<div class="section-header">
      <span class="section-label" style="color:${color}">Row ${row}</span>
      <span class="section-line"></span>
      <span class="section-meta">${rowBottles} btl · $${rowVal.toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:0})}</span>
    </div>
    <div class="table-wrap"><table><thead><tr>
      <th onclick="setSort('slot')" class="${sortKey==='slot'?'sort-'+sortDir:''}">Slot</th>
      <th>Qty</th>
      <th onclick="setSort('producer')" class="${sortKey==='producer'?'sort-'+sortDir:''}">Producer</th>
      <th class="col-label">Label</th>
      <th class="col-vintage" onclick="setSort('vintage')">Vintage</th>
      <th class="col-region" onclick="setSort('region')">Region</th>
      <th onclick="setSort('value')" class="${sortKey==='value'?'sort-'+sortDir:''}" style="text-align:right">$/btl</th>
      <th></th>
    </tr></thead><tbody>`;
    entries.forEach(e => {
      const c = ROW_COLORS[row] || '#888';
      html += `<tr>
        <td><span class="slot-badge" style="color:${c};border-color:${c}40;background:${c}12">${e.slot}</span></td>
        <td><span class="qty-badge">${e.qty}</span></td>
        <td class="producer">${e.producer}</td>
        <td class="label col-label">${e.label}</td>
        <td class="vintage col-vintage">${e.vintage}</td>
        <td class="region col-region">${e.region}</td>
        <td class="value">$${e.value.toFixed(0)}</td>
        <td><div class="actions">
          <button class="btn-sm edit-btn" onclick="openEdit(${e.id})">Edit</button>
          <button class="btn-sm consume" onclick="consume(${e.id})">−1</button>
        </div></td>
      </tr>`;
    });
    html += `</tbody></table></div>`;
  });
  container.innerHTML = html;
}

function renderGrid() {
  const data = getFilteredData();
  const container = document.getElementById('grid-view');
  if (data.length === 0) {
    container.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:60px;font-family:Cormorant Garamond,serif;font-size:20px;font-style:italic">No bottles found</div>';
    return;
  }
  let html = '<div class="grid-container">';
  data.forEach(e => {
    const row = getRowLetter(e.slot);
    const color = ROW_COLORS[row] || '#888';
    html += `<div class="wine-card" onclick="openEdit(${e.id})" style="--card-color:${color}">
      <div style="position:absolute;top:0;left:0;right:0;height:2px;background:${color}40"></div>
      <div class="card-slot">
        <span class="row-color-dot" style="background:${color}"></span>
        <span style="color:${color}">${e.slot}</span>
        <span style="color:var(--text-muted);margin-left:auto">${e.qty} btl</span>
      </div>
      <div class="card-producer">${e.producer}</div>
      <div class="card-label">${e.label}</div>
      <div class="card-footer">
        <span class="card-vintage">${e.vintage}</span>
        <span class="card-value">$${e.value.toFixed(0)}</span>
      </div>
    </div>`;
  });
  html += '</div>';
  container.innerHTML = html;
}

function render() {
  updateStats();
  if (currentView === 'table') renderTable(); else renderGrid();
}

// ── Controls ──────────────────────────────────────────────────────────────────
function setView(v) {
  currentView = v;
  document.getElementById('table-view').style.display = v === 'table' ? 'block' : 'none';
  document.getElementById('grid-view').style.display  = v === 'grid'  ? 'block' : 'none';
  document.getElementById('btn-table').classList.toggle('active', v === 'table');
  document.getElementById('btn-grid').classList.toggle('active', v === 'grid');
  render();
}

function filterRow(row, btn) {
  currentFilter = row;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function setSort(key) {
  if (sortKey === key) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
  else { sortKey = key; sortDir = 'asc'; }
  render();
}

document.getElementById('search').addEventListener('input', e => {
  searchTerm = e.target.value;
  render();
});

// ── Add / Edit Modal ──────────────────────────────────────────────────────────
function openAdd() {
  editingId = null;
  document.getElementById('modal-title').textContent = 'Add Bottle';
  document.getElementById('modal-title').className = 'add-title';
  ['slot','qty','producer','label','vintage','value','region','notes'].forEach(f => {
    document.getElementById('f-'+f).value = f === 'qty' ? 1 : '';
  });
  document.getElementById('btn-delete').style.display = 'none';
  document.getElementById('modal').classList.add('open');
}

function openEdit(id) {
  const e = inventory.find(x => x.id === id);
  if (!e) return;
  editingId = id;
  document.getElementById('modal-title').textContent = 'Edit Entry';
  document.getElementById('modal-title').className = 'add-title';
  document.getElementById('f-slot').value    = e.slot;
  document.getElementById('f-qty').value     = e.qty;
  document.getElementById('f-producer').value= e.producer;
  document.getElementById('f-label').value   = e.label;
  document.getElementById('f-vintage').value = e.vintage;
  document.getElementById('f-value').value   = e.value;
  document.getElementById('f-region').value  = e.region;
  document.getElementById('f-notes').value   = e.notes || '';
  document.getElementById('btn-delete').style.display = 'inline-block';
  document.getElementById('modal').classList.add('open');
}

function closeModal() { document.getElementById('modal').classList.remove('open'); }

function saveEntry() {
  const slot    = document.getElementById('f-slot').value.trim();
  const qty     = parseInt(document.getElementById('f-qty').value) || 1;
  const producer= document.getElementById('f-producer').value.trim();
  const label   = document.getElementById('f-label').value.trim();
  const vintage = document.getElementById('f-vintage').value.trim();
  const value   = parseFloat(document.getElementById('f-value').value) || 0;
  const region  = document.getElementById('f-region').value.trim();
  const notes   = document.getElementById('f-notes').value.trim();
  if (!slot || !producer) { showToast('Slot and Producer required'); return; }
  if (editingId) {
    const idx = inventory.findIndex(x => x.id === editingId);
    if (idx > -1) inventory[idx] = { ...inventory[idx], slot, qty, producer, label, vintage, value, region, notes };
  } else {
    inventory.push({ id: nextId++, slot, qty, producer, label, vintage, value, region, notes });
  }
  saveToStorage();
  render();
  closeModal();
  showToast(editingId ? 'Entry updated' : 'Bottle added');
}

function deleteEntry() {
  if (!editingId) return;
  if (!confirm('Remove this entry entirely?')) return;
  inventory = inventory.filter(x => x.id !== editingId);
  saveToStorage();
  render();
  closeModal();
  showToast('Entry removed');
}

// ── Remove Bottle Modal ───────────────────────────────────────────────────────
function openRemove() {
  removeSelectedId = null;
  document.getElementById('remove-search').value = '';
  document.getElementById('remove-results').innerHTML = '<div class="remove-empty">Start typing to find a wine</div>';
  document.getElementById('remove-summary').classList.remove('visible');
  document.getElementById('remove-confirm-btn').disabled = true;
  document.getElementById('remove-confirm-btn').style.opacity = '0.4';
  document.getElementById('remove-confirm-btn').style.cursor = 'not-allowed';
  document.getElementById('remove-modal').classList.add('open');
  setTimeout(() => document.getElementById('remove-search').focus(), 100);
}

function closeRemoveModal() { document.getElementById('remove-modal').classList.remove('open'); }

function filterRemoveResults() {
  const s = document.getElementById('remove-search').value.toLowerCase().trim();
  const container = document.getElementById('remove-results');
  if (!s) { container.innerHTML = '<div class="remove-empty">Start typing to find a wine</div>'; return; }
  const matches = inventory.filter(e =>
    e.producer.toLowerCase().includes(s) ||
    e.label.toLowerCase().includes(s) ||
    e.slot.toLowerCase().includes(s) ||
    e.vintage.toString().includes(s)
  );
  if (!matches.length) { container.innerHTML = '<div class="remove-empty">No matches found</div>'; return; }
  const row = e => getRowLetter(e.slot);
  const color = e => ROW_COLORS[row(e)] || '#888';
  container.innerHTML = matches.map(e => `
    <div class="remove-result-item ${removeSelectedId === e.id ? 'selected' : ''}" onclick="selectRemoveItem(${e.id})">
      <span class="rr-slot" style="color:${color(e)};border-color:${color(e)}40">${e.slot}</span>
      <div class="rr-info">
        <div class="rr-producer">${e.producer}</div>
        <div class="rr-label">${e.label} · ${e.vintage}</div>
      </div>
      <span class="rr-qty">${e.qty} btl</span>
    </div>`).join('');
}

function selectRemoveItem(id) {
  removeSelectedId = id;
  const e = inventory.find(x => x.id === id);
  if (!e) return;
  document.getElementById('remove-summary-name').textContent = `${e.producer} ${e.label} ${e.vintage}`;
  document.getElementById('remove-qty').value = 1;
  document.getElementById('remove-current-qty').value = e.qty;
  document.getElementById('remove-summary').classList.add('visible');
  document.getElementById('remove-confirm-btn').disabled = false;
  document.getElementById('remove-confirm-btn').style.opacity = '1';
  document.getElementById('remove-confirm-btn').style.cursor = 'pointer';
  filterRemoveResults();
}

function updateRemoveSummary() {
  if (!removeSelectedId) return;
  const e = inventory.find(x => x.id === removeSelectedId);
  if (!e) return;
  const qty = parseInt(document.getElementById('remove-qty').value) || 1;
  document.getElementById('remove-confirm-btn').disabled = qty < 1 || qty > e.qty;
  document.getElementById('remove-confirm-btn').style.opacity = (qty < 1 || qty > e.qty) ? '0.4' : '1';
}

function confirmRemove() {
  if (!removeSelectedId) return;
  const idx = inventory.findIndex(x => x.id === removeSelectedId);
  if (idx < 0) return;
  const qty = parseInt(document.getElementById('remove-qty').value) || 1;
  const e = inventory[idx];
  if (qty >= e.qty) {
    inventory.splice(idx, 1);
    showToast(`Removed: ${e.producer} ${e.label}`);
  } else {
    inventory[idx].qty -= qty;
    showToast(`Removed ${qty} btl · ${e.producer} ${e.label}`);
  }
  saveToStorage();
  render();
  closeRemoveModal();
}

// ── Export ────────────────────────────────────────────────────────────────────
function exportCSV() {
  const headers = ['Slot','Producer','Label','Vintage','Qty','$/Btl','Region','Notes'];
  const rows = [...inventory].sort((a,b) =>
    a.slot.localeCompare(b.slot, undefined, { numeric: true, sensitivity: 'base' })
  ).map(e => [
    e.slot, e.producer, e.label, e.vintage, e.qty, e.value, e.region,
    (e.notes||'').replace(/"/g,'""')
  ].map(v => `"${v}"`).join(','));
  const csv = [headers.join(','), ...rows].join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `wine-cellar-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('Inventory exported as CSV');
}

function resetToSeed() {
  if (confirm('Reset to original inventory? All changes will be lost.')) {
    inventory = JSON.parse(JSON.stringify(SEED_DATA));
    nextId = 50;
    saveToStorage();
    render();
    showToast('Inventory reset to original');
  }
}

// ── Toast ─────────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

// ── Init ──────────────────────────────────────────────────────────────────────
// App loads only after PIN is entered (see unlockApp above)
// If already unlocked this session, loadFromStorage() is called immediately
if (sessionStorage.getItem(SESSION_KEY) === '1') {
  loadFromStorage();
}
</script>
