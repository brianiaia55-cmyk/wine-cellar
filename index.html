<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wine Cellar Registry</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0a08;
    --surface: #141009;
    --card: #1a1410;
    --border: #2a2018;
    --border-light: #3a3025;
    --gold: #c9a84c;
    --gold-dim: #8a6e30;
    --gold-subtle: #3d2e12;
    --text: #e8dcc8;
    --text-dim: #9a8a72;
    --text-muted: #5a4e3e;
    --red-wine: #7a1e2e;
    --row-a: #c9a84c;
    --row-b: #6db87a;
    --row-c: #5ba8d4;
    --row-d: #e07856;
    --row-e: #c46bb8;
    --row-f: #d4b84a;
    --row-g: #78c4b2;
    --row-h: #e8845c;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    min-height: 100vh;
  }

  /* Grain overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 1000;
    opacity: 0.4;
  }

  .header {
    border-bottom: 1px solid var(--border);
    padding: 32px 40px 24px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
  }

  .header-left h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 42px;
    font-weight: 300;
    color: var(--gold);
    letter-spacing: 0.04em;
    line-height: 1;
  }

  .header-left p {
    color: var(--text-dim);
    margin-top: 6px;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .stats {
    display: flex;
    gap: 32px;
    flex-wrap: wrap;
  }

  .stat {
    text-align: right;
  }

  .stat-val {
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px;
    font-weight: 300;
    color: var(--gold);
    line-height: 1;
  }

  .stat-label {
    color: var(--text-muted);
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-top: 3px;
  }

  .toolbar {
    padding: 16px 40px;
    display: flex;
    gap: 12px;
    align-items: center;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }

  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 200px;
    max-width: 340px;
  }

  .search-wrap input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    padding: 8px 12px 8px 32px;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-wrap input:focus { border-color: var(--gold-dim); }
  .search-wrap input::placeholder { color: var(--text-muted); }

  .search-icon {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 12px;
    pointer-events: none;
  }

  .filter-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    padding: 8px 14px;
    cursor: pointer;
    letter-spacing: 0.06em;
    transition: all 0.15s;
    text-transform: uppercase;
  }

  .filter-btn:hover, .filter-btn.active {
    background: var(--gold-subtle);
    border-color: var(--gold-dim);
    color: var(--gold);
  }

  .view-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    padding: 8px 12px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .view-btn.active, .view-btn:hover {
    background: var(--gold-subtle);
    border-color: var(--gold-dim);
    color: var(--gold);
  }

  .add-btn {
    background: var(--gold-subtle);
    border: 1px solid var(--gold-dim);
    color: var(--gold);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    padding: 8px 16px;
    cursor: pointer;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    transition: all 0.15s;
    margin-left: auto;
  }

  .add-btn:hover {
    background: var(--gold);
    color: var(--bg);
  }

  .main {
    padding: 24px 40px 60px;
  }

  /* TABLE VIEW */
  .table-view { display: block; }
  .grid-view { display: none; }

  .section-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 28px 0 10px;
  }

  .section-label {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 300;
    letter-spacing: 0.06em;
  }

  .section-line {
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .section-meta {
    color: var(--text-muted);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .table-wrap {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  @media (max-width: 768px) {
    table { min-width: 700px; }
  }

  th {
    text-align: left;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-muted);
    padding: 6px 10px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    white-space: nowrap;
    user-select: none;
  }

  th:hover { color: var(--gold); }

  td {
    padding: 9px 10px;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    vertical-align: middle;
  }

  tr:hover td { background: rgba(201,168,76,0.04); }

  .slot-badge {
    display: inline-block;
    font-size: 10px;
    letter-spacing: 0.08em;
    padding: 2px 7px;
    font-weight: 400;
    border: 1px solid;
    white-space: nowrap;
  }

  .producer { color: var(--text); font-weight: 400; }
  .label { color: var(--text-dim); font-size: 12px; }
  .vintage { color: var(--gold-dim); font-family: 'Cormorant Garamond', serif; font-size: 15px; }
  .region { color: var(--text-muted); font-size: 11px; }

  .value {
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px;
    font-weight: 300;
    color: var(--gold);
    text-align: right;
    white-space: nowrap;
  }

  .qty-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    background: var(--gold-subtle);
    border: 1px solid var(--gold-dim);
    color: var(--gold);
    font-size: 10px;
    font-weight: 400;
  }

  .actions {
    display: flex;
    gap: 6px;
    justify-content: flex-end;
  }

  .btn-sm {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    padding: 3px 8px;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.06em;
  }

  .btn-sm:hover { border-color: var(--gold-dim); color: var(--gold); }

  .btn-sm.consume:hover { border-color: #c46b6b; color: #c46b6b; }
  .btn-sm.edit-btn:hover { border-color: var(--gold-dim); color: var(--gold); }

  /* GRID VIEW */
  .grid-container {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 10px;
  }

  .wine-card {
    background: var(--card);
    border: 1px solid var(--border);
    padding: 14px;
    transition: border-color 0.2s, transform 0.15s;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }

  .wine-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
  }

  .wine-card:hover {
    border-color: var(--gold-dim);
    transform: translateY(-1px);
  }

  .card-slot {
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .card-producer {
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px;
    font-weight: 400;
    color: var(--text);
    line-height: 1.2;
    margin-bottom: 3px;
  }

  .card-label {
    font-size: 10px;
    color: var(--text-dim);
    margin-bottom: 10px;
    line-height: 1.3;
  }

  .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-top: 8px;
  }

  .card-vintage {
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    color: var(--gold-dim);
    font-weight: 300;
  }

  .card-value {
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px;
    color: var(--gold);
    font-weight: 300;
  }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 500;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--card);
    border: 1px solid var(--border-light);
    width: 100%;
    max-width: 520px;
    padding: 32px;
    position: relative;
    max-height: 90vh;
    overflow-y: auto;
  }

  .modal h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 26px;
    font-weight: 300;
    color: var(--gold);
    margin-bottom: 24px;
    letter-spacing: 0.04em;
  }

  .modal-close {
    position: absolute;
    top: 16px; right: 16px;
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 18px;
    cursor: pointer;
    padding: 4px 8px;
  }

  .modal-close:hover { color: var(--text); }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 14px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
    margin-bottom: 14px;
  }

  .form-group label {
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .form-group input, .form-group select {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    padding: 9px 12px;
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
  }

  .form-group input:focus, .form-group select:focus {
    border-color: var(--gold-dim);
  }

  .form-group select option { background: var(--card); }

  .modal-footer {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }

  .btn-cancel {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    padding: 9px 20px;
    cursor: pointer;
    letter-spacing: 0.08em;
    transition: all 0.15s;
  }

  .btn-cancel:hover { border-color: var(--border-light); color: var(--text); }

  .btn-save {
    background: var(--gold-subtle);
    border: 1px solid var(--gold-dim);
    color: var(--gold);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    padding: 9px 24px;
    cursor: pointer;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    transition: all 0.15s;
  }

  .btn-save:hover { background: var(--gold); color: var(--bg); }

  .btn-delete {
    background: none;
    border: 1px solid #5a2020;
    color: #9a4040;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    padding: 9px 16px;
    cursor: pointer;
    letter-spacing: 0.08em;
    transition: all 0.15s;
    margin-right: auto;
  }

  .btn-delete:hover { background: #3a1010; border-color: #9a4040; color: #c46b6b; }

  .empty-row td {
    text-align: center;
    color: var(--text-muted);
    padding: 28px;
    font-style: italic;
  }

  .row-color-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    display: inline-block;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 28px;
    right: 28px;
    background: var(--card);
    border: 1px solid var(--gold-dim);
    color: var(--gold);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    padding: 12px 20px;
    letter-spacing: 0.08em;
    z-index: 999;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.25s;
    pointer-events: none;
  }

  .toast.show { opacity: 1; transform: translateY(0); }

  /* Sort indicator */
  .sort-asc::after { content: ' ↑'; color: var(--gold); }
  .sort-desc::after { content: ' ↓'; color: var(--gold); }

  @media (max-width: 700px) {
    .header, .toolbar, .main { padding-left: 16px; padding-right: 16px; }
    .form-row { grid-template-columns: 1fr; }
    .stats { gap: 18px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h1>Wine Cellar</h1>
    <p>Personal Registry · Active Inventory</p>
  </div>
  <div class="stats">
    <div class="stat">
      <div class="stat-val" id="stat-bottles">0</div>
      <div class="stat-label">Bottles</div>
    </div>
    <div class="stat">
      <div class="stat-val" id="stat-value">$0</div>
      <div class="stat-label">Est. Value</div>
    </div>
    <div class="stat">
      <div class="stat-val" id="stat-producers">0</div>
      <div class="stat-label">Producers</div>
    </div>
  </div>
</div>

<div class="toolbar">
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input type="text" id="search" placeholder="Search producer, region, vintage...">
  </div>
  <button class="filter-btn active" onclick="filterRow('all', this)">All</button>
  <button class="filter-btn" onclick="filterRow('A', this)">A</button>
  <button class="filter-btn" onclick="filterRow('B', this)">B</button>
  <button class="filter-btn" onclick="filterRow('C', this)">C</button>
  <button class="filter-btn" onclick="filterRow('D', this)">D</button>
  <button class="filter-btn" onclick="filterRow('E', this)">E</button>
  <button class="filter-btn" onclick="filterRow('F', this)">F</button>
  <button class="filter-btn" onclick="filterRow('G', this)">G</button>
  <button class="filter-btn" onclick="filterRow('H', this)">H</button>
  <button class="view-btn active" id="btn-table" onclick="setView('table')">≡</button>
  <button class="view-btn" id="btn-grid" onclick="setView('grid')">⊞</button>
  <button class="add-btn" onclick="openAdd()">+ Add Bottle</button>
  <button class="view-btn" onclick="resetToSeed()" title="Reset to original inventory" style="margin-left:4px;color:#7a5a5a;border-color:#4a2a2a">↺</button>
</div>

<div class="main">
  <div class="table-view" id="table-view"></div>
  <div class="grid-view" id="grid-view"></div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <h2 id="modal-title">Add Bottle</h2>
    <div class="form-row">
      <div class="form-group">
        <label>Slot(s)</label>
        <input type="text" id="f-slot" placeholder="e.g. A1 or A1–A3">
      </div>
      <div class="form-group">
        <label>Quantity</label>
        <input type="number" id="f-qty" value="1" min="1">
      </div>
    </div>
    <div class="form-group">
      <label>Producer</label>
      <input type="text" id="f-producer" placeholder="e.g. PlumpJack">
    </div>
    <div class="form-group">
      <label>Label / Vineyard</label>
      <input type="text" id="f-label" placeholder="e.g. Estate">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Vintage</label>
        <input type="text" id="f-vintage" placeholder="e.g. 2021">
      </div>
      <div class="form-group">
        <label>Value (Est)</label>
        <input type="text" id="f-value" placeholder="e.g. 185.00">
      </div>
    </div>
    <div class="form-group">
      <label>Region</label>
      <input type="text" id="f-region" placeholder="e.g. Napa Valley">
    </div>
    <div class="form-group">
      <label>Notes</label>
      <input type="text" id="f-notes" placeholder="Optional drinking window, pairing, etc.">
    </div>
    <div class="modal-footer">
      <button class="btn-delete" id="btn-delete" onclick="deleteEntry()" style="display:none">Remove</button>
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveEntry()">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">

function saveToStorage() {
  set(inventoryRef, { inventory, nextId }).catch(e => console.warn('Firebase save failed', e));
}

function resetToSeed() {
  if (confirm('Reset to original inventory? All changes will be lost.')) {
    inventory = JSON.parse(JSON.stringify(SEED_DATA));
    nextId = 50;
    saveToStorage();
    render();
    showToast('Inventory reset to original');
  }
}

let currentFilter = 'all';
let currentView = 'table';
let searchTerm = '';
let sortKey = 'slot';
let sortDir = 'asc';
let editingId = null;

function getRowLetter(slot) {
  return slot.charAt(0).toUpperCase();
}

function getFilteredData() {
  let data = [...inventory];
  if (currentFilter !== 'all') {
    data = data.filter(e => getRowLetter(e.slot) === currentFilter);
  }
  if (searchTerm) {
    const s = searchTerm.toLowerCase();
    data = data.filter(e =>
      e.producer.toLowerCase().includes(s) ||
      e.label.toLowerCase().includes(s) ||
      e.region.toLowerCase().includes(s) ||
      e.vintage.toString().includes(s) ||
      e.slot.toLowerCase().includes(s)
    );
  }
  data.sort((a, b) => {
    let va = a[sortKey], vb = b[sortKey];
    if (sortKey === 'value') { va = parseFloat(va); vb = parseFloat(vb); }
    if (sortKey === 'slot') {
      const cmp = va.localeCompare(vb, undefined, { numeric: true, sensitivity: 'base' });
      return sortDir === 'asc' ? cmp : -cmp;
    }
    if (va < vb) return sortDir === 'asc' ? -1 : 1;
    if (va > vb) return sortDir === 'asc' ? 1 : -1;
    return 0;
  });
  return data;
}

function totalBottles(data) { return data.reduce((s, e) => s + e.qty, 0); }
function totalValue(data) { return data.reduce((s, e) => s + e.value * e.qty, 0); }
function uniqueProducers(data) { return new Set(data.map(e => e.producer)).size; }

function updateStats() {
  const data = getFilteredData();
  document.getElementById('stat-bottles').textContent = totalBottles(data);
  document.getElementById('stat-value').textContent = '$' + totalValue(data).toLocaleString(undefined, {minimumFractionDigits:0, maximumFractionDigits:0});
  document.getElementById('stat-producers').textContent = uniqueProducers(data);
}

function groupByRow(data) {
  const groups = {};
  data.forEach(e => {
    const r = getRowLetter(e.slot);
    if (!groups[r]) groups[r] = [];
    groups[r].push(e);
  });
  return groups;
}

function renderTable() {
  const data = getFilteredData();
  const groups = groupByRow(data);
  const container = document.getElementById('table-view');

  if (data.length === 0) {
    container.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:60px;font-family:Cormorant Garamond,serif;font-size:20px;font-style:italic">No bottles found</div>';
    return;
  }

  let html = '';
  const rowKeys = Object.keys(groups).sort();

  rowKeys.forEach(row => {
    const entries = groups[row];
    const color = ROW_COLORS[row] || '#888';
    const rowBottles = totalBottles(entries);
    const rowVal = totalValue(entries);

    html += `<div class="section-header">
      <span class="section-label" style="color:${color}">Row ${row}</span>
      <span class="section-line"></span>
      <span class="section-meta">${rowBottles} btl · $${rowVal.toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:0})}</span>
    </div>`;

    html += `<div class="table-wrap"><table><thead><tr>
      <th onclick="setSort('slot')" class="${sortKey==='slot'?'sort-'+sortDir:''}">Slot</th>
      <th>Qty</th>
      <th onclick="setSort('producer')" class="${sortKey==='producer'?'sort-'+sortDir:''}">Producer</th>
      <th>Label</th>
      <th onclick="setSort('vintage')" class="${sortKey==='vintage'?'sort-'+sortDir:''}">Vintage</th>
      <th onclick="setSort('region')" class="${sortKey==='region'?'sort-'+sortDir:''}">Region</th>
      <th onclick="setSort('value')" class="${sortKey==='value'?'sort-'+sortDir:''}" style="text-align:right">$/btl</th>
      <th></th>
    </tr></thead><tbody>`;

    entries.forEach(e => {
      const color2 = ROW_COLORS[row] || '#888';
      html += `<tr>
        <td><span class="slot-badge" style="color:${color2};border-color:${color2}40;background:${color2}12">${e.slot}</span></td>
        <td><span class="qty-badge">${e.qty}</span></td>
        <td class="producer">${e.producer}</td>
        <td class="label">${e.label}</td>
        <td class="vintage">${e.vintage}</td>
        <td class="region">${e.region}</td>
        <td class="value">$${e.value.toFixed(0)}</td>
        <td><div class="actions">
          <button class="btn-sm edit-btn" onclick="openEdit(${e.id})">Edit</button>
          <button class="btn-sm consume" onclick="consume(${e.id})">−1</button>
        </div></td>
      </tr>`;
    });

    html += `</tbody></table></div>`;
  });

  container.innerHTML = html;
}

function renderGrid() {
  const data = getFilteredData();
  const container = document.getElementById('grid-view');

  if (data.length === 0) {
    container.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:60px;font-family:Cormorant Garamond,serif;font-size:20px;font-style:italic">No bottles found</div>';
    return;
  }

  let html = '<div class="grid-container">';
  data.forEach(e => {
    const row = getRowLetter(e.slot);
    const color = ROW_COLORS[row] || '#888';
    html += `<div class="wine-card" onclick="openEdit(${e.id})" style="--card-color:${color}">
      <div style="position:absolute;top:0;left:0;right:0;height:2px;background:${color}40"></div>
      <div class="card-slot">
        <span class="row-color-dot" style="background:${color}"></span>
        <span style="color:${color}">${e.slot}</span>
        <span style="color:var(--text-muted);margin-left:auto">${e.qty} btl</span>
      </div>
      <div class="card-producer">${e.producer}</div>
      <div class="card-label">${e.label}</div>
      <div class="card-footer">
        <span class="card-vintage">${e.vintage}</span>
        <span class="card-value">$${e.value.toFixed(0)}</span>
      </div>
    </div>`;
  });
  html += '</div>';
  container.innerHTML = html;
}

function render() {
  updateStats();
  if (currentView === 'table') renderTable();
  else renderGrid();
}

function setView(v) {
  currentView = v;
  document.getElementById('table-view').style.display = v === 'table' ? 'block' : 'none';
  document.getElementById('grid-view').style.display = v === 'grid' ? 'block' : 'none';
  document.getElementById('btn-table').classList.toggle('active', v === 'table');
  document.getElementById('btn-grid').classList.toggle('active', v === 'grid');
  render();
}

function filterRow(row, btn) {
  currentFilter = row;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function setSort(key) {
  if (sortKey === key) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
  else { sortKey = key; sortDir = 'asc'; }
  render();
}

document.getElementById('search').addEventListener('input', e => {
  searchTerm = e.target.value;
  render();
});

function openAdd() {
  editingId = null;
  document.getElementById('modal-title').textContent = 'Add Bottle';
  document.getElementById('btn-delete').style.display = 'none';
  ['slot','qty','producer','label','vintage','value','region','notes'].forEach(f => {
    document.getElementById('f-'+f).value = f === 'qty' ? '1' : '';
  });
  document.getElementById('modal').classList.add('open');
}

function openEdit(id) {
  const e = inventory.find(x => x.id === id);
  if (!e) return;
  editingId = id;
  document.getElementById('modal-title').textContent = 'Edit Entry';
  document.getElementById('btn-delete').style.display = 'block';
  document.getElementById('f-slot').value = e.slot;
  document.getElementById('f-qty').value = e.qty;
  document.getElementById('f-producer').value = e.producer;
  document.getElementById('f-label').value = e.label;
  document.getElementById('f-vintage').value = e.vintage;
  document.getElementById('f-value').value = e.value;
  document.getElementById('f-region').value = e.region;
  document.getElementById('f-notes').value = e.notes || '';
  document.getElementById('modal').classList.add('open');
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  editingId = null;
}

function saveEntry() {
  const slot = document.getElementById('f-slot').value.trim();
  const producer = document.getElementById('f-producer').value.trim();
  if (!slot || !producer) { showToast('Slot and producer are required'); return; }

  const entry = {
    slot,
    qty: parseInt(document.getElementById('f-qty').value) || 1,
    producer,
    label: document.getElementById('f-label').value.trim(),
    vintage: document.getElementById('f-vintage').value.trim(),
    value: parseFloat(document.getElementById('f-value').value) || 0,
    region: document.getElementById('f-region').value.trim(),
    notes: document.getElementById('f-notes').value.trim(),
  };

  if (editingId) {
    const idx = inventory.findIndex(x => x.id === editingId);
    inventory[idx] = { ...entry, id: editingId };
    showToast('Entry updated');
  } else {
    inventory.push({ ...entry, id: nextId++ });
    showToast('Bottle added');
  }

  saveToStorage();
  closeModal();
  render();
}

function deleteEntry() {
  if (!editingId) return;
  inventory = inventory.filter(x => x.id !== editingId);
  saveToStorage();
  closeModal();
  render();
  showToast('Entry removed');
}

function consume(id) {
  const e = inventory.find(x => x.id === id);
  if (!e) return;
  if (e.qty <= 1) {
    if (confirm(`Remove last bottle of ${e.producer} ${e.label}?`)) {
      inventory = inventory.filter(x => x.id !== id);
      showToast('Bottle removed from inventory');
      saveToStorage();
    }
  } else {
    e.qty--;
    showToast(`${e.producer} — ${e.qty} remaining`);
    saveToStorage();
  }
  render();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// Close modal on overlay click
document.getElementById('modal').addEventListener('click', e => {
  if (e.target === document.getElementById('modal')) closeModal();
});

// Init — listen to Firebase; seed on first load
let inventory = [];
let nextId = 50;

onValue(inventoryRef, (snapshot) => {
  const data = snapshot.val();
  if (data && data.inventory && data.inventory.length > 0) {
    inventory = data.inventory;
    nextId = data.nextId || 50;
  } else {
    // First time — push seed data to Firebase
    inventory = JSON.parse(JSON.stringify(SEED_DATA));
    nextId = 50;
    saveToStorage();
  }
  render();
}, { onlyOnce: false });
</script>
